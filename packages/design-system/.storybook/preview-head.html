<!-- The typefaces come from the package's fonts.css, which storybook.css imports, as a product
     loads them: no font CDN, so the Storybook renders exactly what a consumer gets. -->
<!-- A wide table on a docs page scrolls inside itself, so the page never scrolls sideways on a phone. -->
<style>
  .sbdocs-content table {
    display: block;
    max-width: 100%;
    overflow-x: auto;
  }
</style>
