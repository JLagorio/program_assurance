<div id="assurance-system-proposal">
  <style>
    #assurance-system-proposal { --pa-surface:light-dark(#fff,#171b23); --pa-rail:light-dark(#f7f8fa,#1c222c); --pa-text:light-dark(#182230,#e4eaf2); --pa-muted:light-dark(#586579,#a7b4c6); --pa-line:light-dark(#e0e5ec,#364152); --pa-blue:light-dark(#0065cc,#82b8ff); --pa-selected:light-dark(#eaf3ff,#223b58); --pa-danger:light-dark(#a9382d,#ffb0a5); font-family:Inter,system-ui,sans-serif; font-size:13px; line-height:1.45; color:var(--pa-text); background:var(--pa-surface); border:1px solid var(--pa-line); border-radius:8px; overflow:hidden; }
    #assurance-system-proposal * { box-sizing:border-box; }
    #assurance-system-proposal button { font:inherit; color:inherit; cursor:pointer; background:transparent; border:0; border-radius:4px; }
    #assurance-system-proposal button:focus-visible { outline:2px solid var(--pa-blue); outline-offset:2px; }
    #assurance-system-proposal button:hover { background:var(--pa-selected); }
    #assurance-system-proposal .pa-chrome { padding:12px 16px; display:flex; gap:12px; align-items:center; border-bottom:1px solid var(--pa-line); }
    #assurance-system-proposal .pa-brand { width:16px; height:16px; border-radius:4px; background:var(--pa-blue); }
    #assurance-system-proposal .pa-muted { color:var(--pa-muted); }
    #assurance-system-proposal .pa-caption { margin-left:auto; font-size:11px; color:var(--pa-muted); }
    #assurance-system-proposal .pa-layout { display:grid; grid-template-columns:175px minmax(0,1fr); }
    #assurance-system-proposal .pa-tree { padding:17px 8px; background:var(--pa-rail); border-right:1px solid var(--pa-line); }
    #assurance-system-proposal .pa-tree-label { padding:0 8px 12px; font-size:11px; letter-spacing:.05em; color:var(--pa-muted); }
    #assurance-system-proposal .pa-tree button { display:block; width:100%; text-align:left; padding:9px 8px; margin-bottom:2px; }
    #assurance-system-proposal .pa-tree button[aria-pressed="true"] { color:var(--pa-blue); background:var(--pa-selected); font-weight:500; }
    #assurance-system-proposal .pa-tree .pa-level1 { padding-left:19px; }
    #assurance-system-proposal .pa-tree .pa-level2 { padding-left:31px; }
    #assurance-system-proposal .pa-content { min-width:0; padding:18px; }
    #assurance-system-proposal .pa-eyebrow { font-size:11px; color:var(--pa-muted); margin-bottom:4px; }
    #assurance-system-proposal h2 { margin:0; font-size:19px; line-height:1.3; font-weight:500; }
    #assurance-system-proposal h3 { margin:0; font-size:14px; font-weight:500; }
    #assurance-system-proposal .pa-source { display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin:12px 0 16px; font-size:11px; color:var(--pa-muted); }
    #assurance-system-proposal .pa-source button { color:var(--pa-blue); padding:3px 0; text-align:left; }
    #assurance-system-proposal .pa-tabs { display:flex; gap:18px; border-bottom:1px solid var(--pa-line); margin-bottom:16px; }
    #assurance-system-proposal .pa-tabs button { padding:8px 0; border-radius:0; border-bottom:2px solid transparent; color:var(--pa-muted); }
    #assurance-system-proposal .pa-tabs button[aria-pressed="true"] { border-bottom-color:var(--pa-blue); color:var(--pa-text); }
    #assurance-system-proposal table { width:100%; border-collapse:collapse; table-layout:fixed; font-size:12px; }
    #assurance-system-proposal th { text-align:left; font-weight:400; color:var(--pa-muted); padding:0 5px 9px; font-size:11px; }
    #assurance-system-proposal td { padding:12px 5px; border-top:1px solid var(--pa-line); vertical-align:top; overflow-wrap:anywhere; }
    #assurance-system-proposal td button { color:var(--pa-blue); padding:0; text-align:left; }
    #assurance-system-proposal .pa-sub { display:block; margin-top:3px; color:var(--pa-muted); font-size:11px; }
    #assurance-system-proposal .pa-selected-row { background:var(--pa-selected); }
    #assurance-system-proposal .pa-danger { color:var(--pa-danger); }
    #assurance-system-proposal .pa-detail { margin-top:20px; padding-top:16px; border-top:1px solid var(--pa-line); }
    #assurance-system-proposal .pa-detail-head { display:flex; align-items:start; justify-content:space-between; gap:10px; }
    #assurance-system-proposal .pa-close { padding:2px 6px; color:var(--pa-muted); }
    #assurance-system-proposal .pa-detail .pa-tabs { font-size:12px; margin-top:10px; margin-bottom:13px; gap:14px; }
    #assurance-system-proposal .pa-detail p { margin:8px 0 12px; }
    #assurance-system-proposal .pa-kv { display:grid; grid-template-columns:115px minmax(0,1fr); gap:8px 10px; margin:12px 0; font-size:12px; }
    #assurance-system-proposal .pa-kv dt { color:var(--pa-muted); }
    #assurance-system-proposal .pa-kv dd { margin:0; }
    #assurance-system-proposal .pa-link { padding:0; color:var(--pa-blue); text-align:left; }
    #assurance-system-proposal .pa-chain { display:flex; gap:7px; flex-wrap:wrap; margin-top:12px; font-size:12px; align-items:center; }
    #assurance-system-proposal .pa-outline { border:1px solid var(--pa-line); padding:5px 8px; }
    #assurance-system-proposal .pa-baseline { padding:12px; background:var(--pa-rail); margin-bottom:15px; }
    #assurance-system-proposal .pa-baseline div+div { margin-top:7px; }
    #assurance-system-proposal .pa-pill { display:inline-block; padding:2px 6px; border:1px solid var(--pa-line); border-radius:3px; margin:3px 4px 0 0; font-size:11px; }
    @media(max-width:520px) {
      #assurance-system-proposal .pa-layout { grid-template-columns:1fr; }
      #assurance-system-proposal .pa-tree { border-right:0; border-bottom:1px solid var(--pa-line); padding:9px; }
      #assurance-system-proposal .pa-tree-label { padding-bottom:5px; }
      #assurance-system-proposal .pa-tree button { padding-block:5px; }
      #assurance-system-proposal .pa-content { padding:15px 11px; }
      #assurance-system-proposal .pa-tabs { gap:20px; }
      #assurance-system-proposal .pa-kv { grid-template-columns:95px minmax(0,1fr); }
    }
    @media(pointer:coarse) { #assurance-system-proposal button { min-height:44px; } }
  </style>
  <div class="pa-chrome"><span class="pa-brand" aria-hidden="true"></span><span>Equinox <span class="pa-muted">/ Sentinel program</span></span><span class="pa-caption">Layout study · sample records</span></div>
  <div class="pa-layout">
    <nav class="pa-tree" aria-label="System structure">
      <div class="pa-tree-label">SYSTEM STRUCTURE</div>
      <button type="button" data-node="system" aria-pressed="false">▾ Sentinel system</button>
      <button type="button" data-node="mission" class="pa-level1" aria-pressed="false">▾ Mission subsystem</button>
      <button type="button" data-node="computer" class="pa-level2" aria-pressed="true">Mission computer</button>
      <button type="button" data-node="radio" class="pa-level1" aria-pressed="false">Radio subsystem</button>
    </nav>
    <main class="pa-content">
      <div class="pa-eyebrow" data-kind>LRU · MC-01</div>
      <h2 data-name>Mission computer</h2>
      <div class="pa-source"><span data-lineage>System control set → Mission subsystem</span><span aria-hidden="true">·</span><button type="button" data-tailoring>View tailoring</button></div>
      <nav class="pa-tabs" aria-label="Selected system views">
        <button type="button" data-view="controls" aria-pressed="true">Controls</button>
        <button type="button" data-view="requirements" aria-pressed="false">Requirements</button>
        <button type="button" data-view="ssp" aria-pressed="false">SSP</button>
      </nav>
      <div data-work aria-live="polite"></div>
    </main>
  </div>
  <script>
  (() => {
    const root = document.getElementById('assurance-system-proposal');
    const work = root.querySelector('[data-work]');
    const nodes = {
      system:{name:'Sentinel system',kind:'SYSTEM · Authorization boundary',lineage:'800-53 baseline + Platform overlay + Program overlay',impl:'Contributions from mission and radio subsystems',req:'System allocation'},
      mission:{name:'Mission subsystem',kind:'SUBSYSTEM · MS-01',lineage:'Inherited from Sentinel system',impl:'Mission computer and subsystem services',req:'Subsystem allocation'},
      computer:{name:'Mission computer',kind:'LRU · MC-01',lineage:'System control set → Mission subsystem',impl:'Local · Boot ROM',req:'Component allocation'},
      radio:{name:'Radio subsystem',kind:'SUBSYSTEM · RS-01',lineage:'Inherited from Sentinel system',impl:'Local · Radio controller',req:'Subsystem allocation'}
    };
    let node = 'computer', view = 'controls', selected = 'SI-7', detail = 'implementation', tailoring = false;
    function tabs() { return `<nav class="pa-tabs" aria-label="Control details">${['implementation','evidence','assessment'].map(x=>`<button type="button" data-detail="${x}" aria-pressed="${detail===x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</nav>`; }
    function controlDetail() {
      if (!selected) return '';
      const si = selected === 'SI-7';
      let body = '';
      if (detail === 'implementation') body = si ? `<p>Boot ROM validates firmware signatures and rejects older security versions before execution.</p><dl class="pa-kv"><dt>Responsible</dt><dd>${node==='radio'?'Radio team':'Mission software team'}</dd><dt>Requirement</dt><dd><button class="pa-link" data-action="requirement">REQ-042 · Trusted firmware</button></dd><dt>SSP contribution</dt><dd><button class="pa-link" data-action="ssp">SI-7 / ${nodes[node].name}</button></dd></dl>` : `<p>Audit records are forwarded to the mission subsystem's logging service.</p><dl class="pa-kv"><dt>Provided by</dt><dd>Mission subsystem</dd><dt>Local responsibility</dt><dd>Emit boot and maintenance events</dd><dt>SSP contribution</dt><dd>AU-2 / Mission logging service</dd></dl>`;
      if (detail === 'evidence') body = `<dl class="pa-kv"><dt>Artifact</dt><dd>${si?'Secure boot verification report':'Audit capture report'}<span class="pa-sub">${si?'Build 2.4 · Report revision 3':'Build 2.4 · Report revision 1'}</span></dd><dt>Supports</dt><dd>${selected} · ${si?'REQ-042':'Mission logging'} · ${nodes[node].name}</dd></dl>`;
      if (detail === 'assessment') body = si ? `<dl class="pa-kv"><dt>Test</dt><dd>Install an older signed image</dd><dt>Observed</dt><dd>Image accepted on build 2.4</dd><dt>Determination</dt><dd class="pa-danger">Not met</dd></dl><div class="pa-chain"><button class="pa-outline" data-action="finding">F-012 · Rollback accepted</button><span aria-hidden="true">→</span><button class="pa-outline" data-action="poam">P-007 · Remediation</button></div>` : `<dl class="pa-kv"><dt>Test</dt><dd>Capture boot and maintenance events</dd><dt>Determination</dt><dd>Met · Build 2.4</dd></dl>`;
      if (detail === 'finding') body = `<dl class="pa-kv"><dt>Finding</dt><dd>F-012 · Older signed firmware accepted</dd><dt>Affected</dt><dd>Mission computer · SI-7 · REQ-042</dd><dt>Evidence</dt><dd>Secure boot verification report</dd><dt>Status</dt><dd>Remediating</dd></dl><button class="pa-outline" data-action="poam">P-007 · View remediation</button>`;
      if (detail === 'poam') body = `<dl class="pa-kv"><dt>Remediation</dt><dd>P-007 · Enforce security version checks</dd><dt>Owner</dt><dd>Mission software team</dd><dt>Milestone</dt><dd>Correct bootloader · 18 Sep</dd><dt>Closure</dt><dd>Verify rollback rejection on the corrected build</dd></dl>`;
      return `<section class="pa-detail"><div class="pa-detail-head"><div><div class="pa-eyebrow">${selected} · ${nodes[node].name}</div><h3>${si?'Firmware integrity':'Event logging'}</h3></div><button class="pa-close" data-action="close" aria-label="Close control details">✕</button></div>${tabs()}${body}</section>`;
    }
    function render() {
      const current=nodes[node];
      root.querySelector('[data-kind]').textContent=current.kind;
      root.querySelector('[data-name]').textContent=current.name;
      root.querySelector('[data-lineage]').textContent=current.lineage;
      root.querySelectorAll('[data-node]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.node===node)));
      root.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view&&!tailoring)));
      root.querySelector('[data-tailoring]').textContent=tailoring?'Back to controls':'View tailoring';
      if (tailoring) {
        work.innerHTML=`<div class="pa-baseline"><h3>${node==='system'?'System control set':'Inherited control set + local tailoring'}</h3><div><span class="pa-pill">800-53 baseline</span><span class="pa-pill">Platform overlay</span><span class="pa-pill">Program overlay</span></div></div><table><thead><tr><th>Control</th><th>Decision here</th><th>Basis</th></tr></thead><tbody><tr><td>SI-7</td><td>${node==='system'?'Included':'Retained'}</td><td>${node==='system'?'System baseline':'Parent control set'}</td></tr><tr><td>AU-2</td><td>${node==='system'?'Included':'Retained'}</td><td>${node==='system'?'System baseline':'Parent control set'}</td></tr><tr><td>PE-3</td><td>${node==='computer'?'Not applicable locally':'Included'}</td><td>${node==='computer'?'Platform enclosure controls physical access':'System baseline'}</td></tr></tbody></table>`;
        return;
      }
      if (view==='controls') work.innerHTML=`<table><thead><tr><th style="width:35%">Applicable control</th><th style="width:38%">Implementation</th><th>Assessment</th></tr></thead><tbody><tr class="${selected==='SI-7'?'pa-selected-row':''}"><td><button data-control="SI-7">SI-7<span class="pa-sub">Firmware integrity</span></button></td><td>${current.impl}</td><td class="pa-danger">Not met</td></tr><tr class="${selected==='AU-2'?'pa-selected-row':''}"><td><button data-control="AU-2">AU-2<span class="pa-sub">Event logging</span></button></td><td>${node==='computer'?'Provided by mission subsystem':'Mission logging service'}</td><td>Met</td></tr></tbody></table>${controlDetail()}`;
      if (view==='requirements') work.innerHTML=`<table><thead><tr><th style="width:40%">Requirement</th><th style="width:34%">Origin / control</th><th>Verification</th></tr></thead><tbody><tr><td><button data-action="control">REQ-042<span class="pa-sub">Reject unsigned or rollback firmware</span></button></td><td>Derived from SI-7</td><td class="pa-danger">Not met</td></tr><tr><td>REQ-071<span class="pa-sub">Ready within 30 seconds</span></td><td>System performance specification<span class="pa-sub">No control mapping</span></td><td>Met</td></tr></tbody></table><div class="pa-source">${current.req} · ${current.name}</div>`;
      if (view==='ssp') work.innerHTML=`<div class="pa-detail-head"><div><div class="pa-eyebrow">SENTINEL SYSTEM</div><h3>System security plan</h3></div><span class="pa-muted">Draft</span></div><dl class="pa-kv"><dt>Boundary</dt><dd>Mission and radio subsystems</dd><dt>Control set</dt><dd>System baseline + approved overlays and tailoring</dd><dt>Responsibilities</dt><dd>System owner · Mission team · Radio team</dd></dl><section class="pa-detail"><h3>SI-7 · Component contributions</h3><table style="margin-top:13px"><thead><tr><th style="width:35%">Component</th><th>Implementation statement</th></tr></thead><tbody><tr><td><button data-action="computer">Mission computer</button></td><td>Boot ROM validates firmware signatures and rejects older security versions.<span class="pa-sub">Secure boot verification report · REQ-042</span></td></tr><tr><td><button data-action="radio">Radio controller</button></td><td>Controller verifies signed firmware during updates.<span class="pa-sub">Radio firmware design description</span></td></tr></tbody></table></section>`;
    }
    root.addEventListener('click',event=>{
      const b=event.target.closest('button'); if(!b||!root.contains(b))return;
      if(b.dataset.node){node=b.dataset.node;selected=null;detail='implementation';}
      if(b.dataset.view){view=b.dataset.view;tailoring=false;selected=null;}
      if(b.hasAttribute('data-tailoring')){tailoring=!tailoring;view='controls';selected=null;}
      if(b.dataset.control){selected=b.dataset.control;detail='implementation';}
      if(b.dataset.detail)detail=b.dataset.detail;
      const action=b.dataset.action;
      if(action==='close')selected=null;
      if(action==='requirement'){view='requirements';selected=null;}
      if(action==='ssp'){view='ssp';selected=null;}
      if(action==='control'){view='controls';selected='SI-7';detail='implementation';}
      if(action==='finding'||action==='poam')detail=action;
      if(action==='computer'||action==='radio'){node=action;view='controls';selected='SI-7';detail='implementation';}
      render();
    });
    render();
  })();
  </script>
</div>
