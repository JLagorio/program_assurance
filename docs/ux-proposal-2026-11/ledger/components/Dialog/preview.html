<!-- @dsCard group="Overlays" height=716 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dialog</title>
<style>
body { margin: 0; background: var(--ds-elevation-surface); }
.lx.l-card { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.lx .l-spec { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px 16px; align-items: center; }
.lx .l-spec > .t-label { align-self: center; }
.lx .l-spec > .is-top { align-self: start; padding-top: 6px; }
.lx .l-stage { position: relative; overflow: hidden; border: 1px solid var(--ds-color-border); border-radius: 10px; background: var(--ds-elevation-surface); }
.lx .l-dialog-stage { height: 420px; }
.lx .l-confirm-stage { height: 240px; }
.lx .l-stage > .k-blanket { padding: 32px 24px; align-items: center; }
.lx .k-dialog.l-confirm { width: 440px; }
.lx .l-two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.lx .k-field.l-wide { width: 100%; }
</style>
</head>
<body style="margin:0">
<div class="lx l-card">
  <div class="l-stage l-dialog-stage">
    <div class="k-blanket">
      <div class="k-dialog" role="dialog" aria-modal="true" aria-label="Create task">
        <div class="k-dialog-head"><h2 class="k-dialog-title grow">Create task</h2><a class="k-btn is-subtle is-icon s-xs" aria-label="Close"><svg class="i s-14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></a></div>
        <div class="k-dialog-body">
          <div class="col g-050"><span class="k-label">Title</span><span class="k-field s-md l-wide"><span class="truncate">Collect replacement evidence for REQ-008</span></span></div>
          <div class="l-two">
            <div class="col g-050"><span class="k-label">Owner</span><span class="k-field s-md l-wide"><span class="grow truncate">Ingrid Solberg</span><svg class="i s-14 c-subtle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span></div>
            <div class="col g-050"><span class="k-label">Due date</span><span class="k-field s-md l-wide"><span class="grow">Nov 30, 2026</span><svg class="i s-14 c-subtle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg></span></div>
          </div>
          <div class="col g-050"><span class="k-label">Program</span><span>WS-X90 Sentinel Mission System</span></div>
        </div>
        <div class="k-dialog-foot"><a class="k-btn is-subtle s-md">Cancel</a><a class="k-btn is-primary s-md">Create task</a></div>
      </div>
    </div>
  </div>
  <div class="l-stage l-confirm-stage">
    <div class="k-blanket">
      <div class="k-dialog l-confirm" role="alertdialog" aria-modal="true" aria-label="Unlink requirement">
        <div class="k-dialog-head"><h2 class="k-dialog-title">Unlink REQ-008 from this issue?</h2></div>
        <div class="k-dialog-body"><span>The issue stops counting against REQ-008. The requirement stays.</span></div>
        <div class="k-dialog-foot"><a class="k-btn is-subtle s-md">Keep requirement</a><a class="k-btn is-danger s-md">Unlink requirement</a></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
