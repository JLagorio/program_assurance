<!-- @dsCard group="Measures" height=116 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Progress</title>
<style>
body { margin: 0; background: var(--ds-elevation-surface); }
.lx.l-card { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.lx .l-spec { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px 16px; align-items: center; }
.lx .l-spec > .t-label { align-self: center; }
.lx .l-spec > .is-top { align-self: start; padding-top: 6px; }
.lx .l-stage { position: relative; overflow: hidden; border: 1px solid var(--ds-color-border); border-radius: 10px; background: var(--ds-elevation-surface); }
.lx .l-bars { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px 32px; max-width: 760px; }
</style>
</head>
<body style="margin:0">
<div class="lx l-card">
  <div class="l-bars">
    <div class="col g-075">
      <div class="row between"><span class="k-label">Gates completed</span><span class="c-subtle">14 of 19</span></div>
      <div class="k-progress" role="progressbar" aria-label="Gates completed" aria-valuenow="14" aria-valuemin="0" aria-valuemax="19"><i style="width: 73.7%"></i></div>
    </div>
    <div class="col g-075">
      <div class="row between"><span class="k-label">Controls determined</span><span class="c-subtle">221 of 560</span></div>
      <div class="k-progress" role="progressbar" aria-label="Controls determined" aria-valuenow="221" aria-valuemin="0" aria-valuemax="560"><i style="width: 39.5%"></i></div>
    </div>
    <div class="col g-075">
      <div class="row between"><span class="k-label">Uploading SSP-WSX90-rev3.pdf</span><span class="c-subtle">4.1 MB of 12 MB</span></div>
      <div class="k-progress" role="progressbar" aria-label="Uploading SSP-WSX90-rev3.pdf" aria-valuenow="34" aria-valuemin="0" aria-valuemax="100"><i style="width: 34%"></i></div>
    </div>
    <div class="col g-075">
      <div class="row between"><span class="k-label">Baseline controls with a requirement</span><span class="c-subtle">0 of 546</span></div>
      <div class="k-progress" role="progressbar" aria-label="Baseline controls with a requirement" aria-valuenow="0" aria-valuemin="0" aria-valuemax="546"></div>
    </div>
  </div>
</div>
</body>
</html>
