<!-- @dsCard group="Shell" height=560 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PhoneFrame</title>
<style>
body { margin: 0; background: var(--ds-elevation-surface); }
.lx.l-card { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.lx .l-spec { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px 16px; align-items: center; }
.lx .l-spec > .t-label { align-self: center; }
.lx .l-spec > .is-top { align-self: start; padding-top: 6px; }
.lx .l-stage { position: relative; overflow: hidden; border: 1px solid var(--ds-color-border); border-radius: 10px; background: var(--ds-elevation-surface); }
.lx .k-phone.l-phone { min-height: 520px; border: 1px solid var(--ds-color-border); border-radius: 12px; overflow: hidden; }
</style>
</head>
<body style="margin:0">
<div class="lx l-card">
  <div class="k-phone l-phone">
    <div class="k-phone-top">
      <span class="k-btn is-subtle is-icon s-md" aria-label="Menu"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/></svg></span>
      <span class="w-500 grow truncate">WS-X90 Sentinel Mission System</span>
      <span class="k-btn is-subtle is-icon s-md" aria-label="Search"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg></span>
      <span class="k-avatar">PR</span>
    </div>
    <div class="k-phone-main">
      <div class="k-pagehead">
        <div class="k-trail"><a>Programs</a><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg><a>WS-X90</a><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg><span aria-current="page">Tasks</span></div>
        <div class="k-titlebar"><h1 class="t-small-h truncate">Monthly STIG compliance scan</h1></div>
      </div>
      <dl class="k-kv">
        <dt>Status</dt><dd><span class="k-badge t-danger">Blocked</span></dd>
        <dt>Owner</dt><dd>Joel Barrantes</dd>
        <dt>Due</dt><dd><span class="k-date is-overdue"><svg class="i s-12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>Nov 12, 2026 · <b class="w-500">Overdue</b></span></dd>
        <dt>Program</dt><dd><a class="k-link">WS-X90</a></dd>
      </dl>
      <div class="k-alert t-warning"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg><span>The maintenance window slipped. The scan cannot run before Nov 18.</span></div>
    </div>
    <div class="k-phone-bar">
      <a class="k-btn is-secondary s-lg grow">Reassign</a>
      <a class="k-btn is-primary s-lg grow">Remind Joel Barrantes</a>
    </div>
  </div>
</div>
</body>
</html>
