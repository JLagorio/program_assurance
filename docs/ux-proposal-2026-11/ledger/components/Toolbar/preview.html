<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toolbar</title>
<style>
body { margin: 0; background: var(--ds-elevation-surface); }
.lx.l-card { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.lx .l-spec { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px 16px; align-items: center; }
.lx .l-spec > .t-label { align-self: center; }
.lx .l-spec > .is-top { align-self: start; padding-top: 6px; }
.lx .l-stage { position: relative; overflow: hidden; border: 1px solid var(--ds-color-border); border-radius: 10px; background: var(--ds-elevation-surface); }
</style>
</head>
<body style="margin:0">
<div class="lx l-card">
  <div class="col g-100">
    <span class="t-label">Register</span>
    <div class="k-toolbar">
      <span class="k-field is-search"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg><span class="truncate">Find risks</span></span>
      <a class="k-btn is-subtle">All risks<svg class="i s-14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></a>
      <a class="k-chip is-on">Severity: High<svg class="i s-12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></a>
      <a class="k-chip">Status</a>
      <a class="k-chip">Owner</a>
      <span class="grow"></span>
      <a class="k-btn is-subtle is-icon" aria-label="Sort"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg></a>
      <a class="k-btn is-subtle is-icon" aria-label="Columns"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="M15 3v18"/></svg></a>
      <a class="k-btn is-subtle is-icon" aria-label="Collection actions"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></a>
      <a class="k-btn is-primary">Create risk</a>
    </div>
  </div>
  <div class="col g-100">
    <span class="t-label">Collection under a Section heading</span>
    <div class="k-toolbar">
      <span class="k-field is-search"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg><span class="truncate">Find assessment findings</span></span>
      <a class="k-chip">Determination</a>
      <span class="grow"></span>
      <a class="k-btn is-secondary">Create assessment finding</a>
    </div>
  </div>
  <div class="col g-100">
    <span class="t-label">With a view switcher</span>
    <div class="k-toolbar">
      <span class="t-section">560 controls, 31% satisfied</span>
      <span class="grow"></span>
      <span class="k-toggle" role="group" aria-label="Show as"><a class="k-toggle-item" aria-pressed="true">Families</a><a class="k-toggle-item" aria-pressed="false">List</a></span>
    </div>
  </div>
</div>
</body>
</html>
