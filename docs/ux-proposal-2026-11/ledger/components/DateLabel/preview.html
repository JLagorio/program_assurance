<!-- @dsCard group="Status" height=124 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DateLabel</title>
<style>
body { margin: 0; background: var(--ds-elevation-surface); }
.lx.l-card { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.lx .l-spec { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px 16px; align-items: center; }
.lx .l-spec > .t-label { align-self: center; }
.lx .l-spec > .is-top { align-self: start; padding-top: 6px; }
.lx .l-stage { position: relative; overflow: hidden; border: 1px solid var(--ds-color-border); border-radius: 10px; background: var(--ds-elevation-surface); }
</style>
</head>
<body style="margin:0">
<div class="lx l-card">
  <div class="l-spec">
    <span class="t-label">Due</span>
    <div class="row wrap g-200">
      <span class="k-date is-overdue"><svg class="i s-12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>Oct 10, 2026 · <b class="w-500">Overdue</b></span>
      <span class="k-date is-soon"><svg class="i s-12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>Nov 15, 2026 · <b class="w-500">Due today</b></span>
      <span class="k-date is-soon"><svg class="i s-12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>Nov 16, 2026 · <b class="w-500">Due tomorrow</b></span>
      <span class="k-date"><svg class="i s-12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>Dec 17, 2026</span>
    </div>
    <span class="t-label">Expiry</span>
    <div class="row wrap g-200">
      <span class="k-date is-overdue"><svg class="i s-12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>May 31, 2026 · <b class="w-500">Expired</b></span>
      <span class="k-date is-soon"><svg class="i s-12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>Nov 17, 2026 · <b class="w-500">Expires in 2 days</b></span>
      <span class="k-date"><svg class="i s-12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>Sep 17, 2029</span>
    </div>
    <span class="t-label">Done work</span>
    <div class="row wrap g-200"><span class="k-date c-subtle"><svg class="i s-12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>Oct 6, 2026</span></div>
  </div>
</div>
</body>
</html>
