<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StandingLine</title>
<style>
body { margin: 0; background: var(--ds-elevation-surface); }
.lx.l-card { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.lx .l-spec { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px 16px; align-items: center; }
.lx .l-spec > .t-label { align-self: center; }
.lx .l-spec > .is-top { align-self: start; padding-top: 6px; }
.lx .l-stage { position: relative; overflow: hidden; border: 1px solid var(--ds-color-border); border-radius: 10px; background: var(--ds-elevation-surface); }
.lx.l-card .nx-standline { overflow-x: auto; }
</style>
</head>
<body style="margin:0">
<div class="lx l-card">
  <div class="col g-100">
    <span class="t-label">In the chain line's place</span>
    <div class="nx-standline">
      <span><b>54</b> controls</span>
      <span class="nx-standbar s-lg" aria-hidden="true"><i class="m-sat" style="flex: 44"></i><i class="m-part" style="flex: 6"></i><i class="m-other" style="flex: 4"></i></span>
      <span class="nx-det is-sat"><b>44</b> satisfied</span><span class="nx-det is-part"><b>6</b> partially</span><span class="nx-det is-not"><b>4</b> not satisfied</span>
      <span class="nx-standline__end">Elena Vasquez · Sep 30</span>
    </div>
  </div>
  <div class="l-spec">
    <span class="t-label">In a table cell</span>
    <div class="row wrap g-300">
      <span class="nx-stand"><span class="nx-standbar" aria-hidden="true"><i class="m-sat" style="flex: 161"></i><i class="m-part" style="flex: 34"></i><i class="m-other" style="flex: 24"></i><i class="m-na" style="flex: 4"></i></span><span><b>161</b> <span class="of">of 223</span></span></span>
      <span class="nx-stand"><span class="nx-standbar" aria-hidden="true"><i class="m-sat" style="flex: 116"></i><i class="m-part" style="flex: 29"></i><i class="m-other" style="flex: 33"></i><i class="m-na" style="flex: 3"></i><i class="m-noreq" style="flex: 193"></i></span><span><b>116</b> <span class="of">of 374</span></span></span>
    </div>
    <span class="t-label">The bar alone</span>
    <div class="row wrap g-300"><span class="nx-standbar" aria-hidden="true"><i class="m-sat" style="flex: 73"></i><i class="m-part" style="flex: 24"></i><i class="m-other" style="flex: 8"></i><i class="m-na" style="flex: 3"></i></span><span class="nx-standbar s-lg" aria-hidden="true"><i class="m-sat" style="flex: 73"></i><i class="m-part" style="flex: 24"></i><i class="m-other" style="flex: 8"></i><i class="m-na" style="flex: 3"></i></span></div>
  </div>
</div>
</body>
</html>
