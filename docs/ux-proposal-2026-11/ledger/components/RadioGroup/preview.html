<!-- @dsCard group="Forms" height=170 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RadioGroup</title>
<style>
body { margin: 0; background: var(--ds-elevation-surface); }
.lx.l-card { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.lx .l-spec { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px 16px; align-items: center; }
.lx .l-spec > .t-label { align-self: center; }
.lx .l-spec > .is-top { align-self: start; padding-top: 6px; }
.lx .l-stage { position: relative; overflow: hidden; border: 1px solid var(--ds-color-border); border-radius: 10px; background: var(--ds-elevation-surface); }
</style>
</head>
<body style="margin:0">
<div class="lx l-card">
  <div class="l-spec">
    <span class="t-label">States</span>
    <div class="row wrap g-250">
      <span class="row g-100"><span class="k-radio" role="radio" aria-checked="false"></span>Not chosen</span>
      <span class="row g-100"><span class="k-radio is-on" role="radio" aria-checked="true"></span>Chosen</span>
    </div>
    <span class="t-label is-top">Objectives</span>
    <div class="col g-100" role="radiogroup" aria-label="Objectives">
      <span class="row g-100"><span class="k-radio is-on" role="radio" aria-checked="true"></span>Whole control</span>
      <span class="row g-100"><span class="k-radio" role="radio" aria-checked="false"></span>Chosen objectives</span>
      <span class="k-hint">A mapping of the whole control covers all 26 objectives of AC-2.</span>
    </div>
    <span class="t-label is-top">Decision</span>
    <div class="row wrap g-250" role="radiogroup" aria-label="Decision">
      <span class="row g-100"><span class="k-radio is-on" role="radio" aria-checked="true"></span>Adds</span>
      <span class="row g-100"><span class="k-radio" role="radio" aria-checked="false"></span>Removes</span>
    </div>
  </div>
</div>
</body>
</html>
