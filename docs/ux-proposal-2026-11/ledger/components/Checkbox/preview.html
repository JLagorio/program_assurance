<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Checkbox</title>
<style>
body { margin: 0; background: var(--ds-elevation-surface); }
.lx.l-card { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.lx .l-spec { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px 16px; align-items: center; }
.lx .l-spec > .t-label { align-self: center; }
.lx .l-spec > .is-top { align-self: start; padding-top: 6px; }
.lx .l-stage { position: relative; overflow: hidden; border: 1px solid var(--ds-color-border); border-radius: 10px; background: var(--ds-elevation-surface); }
</style>
</head>
<body style="margin:0">
<div class="lx l-card">
  <div class="l-spec">
    <span class="t-label">States</span>
    <div class="row wrap g-250">
      <span class="row g-100"><span class="k-check" role="checkbox" aria-checked="false"></span>Not chosen</span>
      <span class="row g-100"><span class="k-check is-on" role="checkbox" aria-checked="true"><svg class="i s-12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>Chosen</span>
      <span class="row g-100"><span class="k-check is-on" role="checkbox" aria-checked="mixed"><svg class="i s-12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></span>Some chosen</span>
    </div>
    <span class="t-label is-top">A list of several</span>
    <div class="col g-100">
      <span class="row g-100"><span class="k-check is-on" role="checkbox" aria-checked="true"><svg class="i s-12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>Anticipate</span>
      <span class="row g-100"><span class="k-check is-on" role="checkbox" aria-checked="true"><svg class="i s-12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>Withstand</span>
      <span class="row g-100"><span class="k-check" role="checkbox" aria-checked="false"></span>Recover</span>
      <span class="row g-100"><span class="k-check" role="checkbox" aria-checked="false"></span>Adapt</span>
      <span class="k-hint">Cyber resiliency goals, as SA-24 names them.</span>
    </div>
  </div>
</div>
</body>
</html>
