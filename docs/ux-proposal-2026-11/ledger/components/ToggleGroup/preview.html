<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ToggleGroup</title>
<style>
body { margin: 0; background: var(--ds-elevation-surface); }
.lx.l-card { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.lx .l-spec { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px 16px; align-items: center; }
.lx .l-spec > .t-label { align-self: center; }
.lx .l-spec > .is-top { align-self: start; padding-top: 6px; }
.lx .l-stage { position: relative; overflow: hidden; border: 1px solid var(--ds-color-border); border-radius: 10px; background: var(--ds-elevation-surface); }
</style>
</head>
<body style="margin:0">
<div class="lx l-card">
  <div class="l-spec">
    <span class="t-label">Show as</span>
    <div class="row wrap g-200">
      <span class="k-toggle" role="group" aria-label="Show as"><a class="k-toggle-item" aria-pressed="true">Grid</a><a class="k-toggle-item" aria-pressed="false">Skyline</a><a class="k-toggle-item" aria-pressed="false">List</a></span>
      <span class="k-toggle" role="group" aria-label="Show as"><a class="k-toggle-item" aria-pressed="false">Families</a><a class="k-toggle-item" aria-pressed="true">List</a></span>
    </div>
    <span class="t-label">Count</span>
    <div class="row wrap"><span class="k-toggle" role="group" aria-label="Count"><a class="k-toggle-item" aria-pressed="true">Objectives mapped</a><a class="k-toggle-item" aria-pressed="false">Without evidence</a><a class="k-toggle-item" aria-pressed="false">Open issues</a><a class="k-toggle-item" aria-pressed="false">Open risks</a></span></div>
    <span class="t-label">With icons</span>
    <div class="row wrap"><span class="k-toggle" role="group" aria-label="Show as"><a class="k-toggle-item" aria-pressed="true"><svg class="i s-14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>Chart</a><a class="k-toggle-item" aria-pressed="false"><svg class="i s-14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18"/><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/></svg>Table</a></span></div>
  </div>
</div>
</body>
</html>
