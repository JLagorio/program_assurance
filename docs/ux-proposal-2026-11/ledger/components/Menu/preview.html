<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Menu</title>
<style>
body { margin: 0; background: var(--ds-elevation-surface); }
.lx.l-card { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.lx .l-spec { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px 16px; align-items: center; }
.lx .l-spec > .t-label { align-self: center; }
.lx .l-spec > .is-top { align-self: start; padding-top: 6px; }
.lx .l-stage { position: relative; overflow: hidden; border: 1px solid var(--ds-color-border); border-radius: 10px; background: var(--ds-elevation-surface); }
.lx .l-menus { display: flex; flex-wrap: wrap; gap: 24px 32px; align-items: flex-start; }
.lx .l-trigger { align-self: flex-start; }
.lx .k-divider.l-sep { margin: 4px 0; width: 100%; }
.lx .l-menus .k-menu { min-width: 220px; }
</style>
</head>
<body style="margin:0">
<div class="lx l-card">
  <div class="l-menus">
    <div class="col g-050">
      <a class="k-btn is-secondary l-trigger">Actions<svg class="i s-14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></a>
      <div class="k-menu" role="menu" aria-label="Actions">
        <a class="k-menu-item" role="menuitem"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>Edit risk</a>
        <a class="k-menu-item is-hover" role="menuitem"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg>Assign owner</a>
        <a class="k-menu-item" role="menuitem"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>Link ATT&amp;CK technique</a>
        <hr class="k-divider l-sep">
        <a class="k-menu-item" role="menuitem"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></svg>Inspect record</a>
      </div>
    </div>
    <div class="col g-050">
      <a class="k-btn is-subtle is-icon l-trigger" aria-label="Row actions for REQ-008"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></a>
      <div class="k-menu" role="menu" aria-label="Row actions for REQ-008">
        <a class="k-menu-item" role="menuitem">Open requirement</a>
        <a class="k-menu-item" role="menuitem">Edit control mapping</a>
        <hr class="k-divider l-sep">
        <a class="k-menu-item c-danger" role="menuitem">Unlink requirement</a>
      </div>
    </div>
    <div class="col g-050">
      <a class="k-btn is-secondary l-trigger">Revision 3<svg class="i s-14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></a>
      <div class="k-menu" role="menu" aria-label="Revision">
        <a class="k-menu-item" role="menuitemradio" aria-checked="true"><span class="k-radio is-on"></span><span class="grow">Revision 3</span><span class="k-badge s-xs">Draft</span></a>
        <a class="k-menu-item" role="menuitemradio" aria-checked="false"><span class="k-radio"></span><span class="grow">Revision 2</span><span class="k-badge s-xs t-success">Published</span></a>
        <a class="k-menu-item" role="menuitemradio" aria-checked="false"><span class="k-radio"></span><span class="grow">Revision 1</span><span class="k-badge s-xs t-success">Published</span></a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
