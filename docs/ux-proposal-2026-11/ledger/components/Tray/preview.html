<!-- @dsCard group="Surfaces" height=312 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tray</title>
<style>
body { margin: 0; background: var(--ds-elevation-surface); }
.lx.l-card { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.lx .l-spec { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px 16px; align-items: center; }
.lx .l-spec > .t-label { align-self: center; }
.lx .l-spec > .is-top { align-self: start; padding-top: 6px; }
.lx .l-stage { position: relative; overflow: hidden; border: 1px solid var(--ds-color-border); border-radius: 10px; background: var(--ds-elevation-surface); }
.lx .l-trays { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; align-items: start; }
.lx .k-statrow.l-bad b { color: var(--ds-color-text-danger); }
.lx .k-statrow.l-zero, .lx .k-statrow.l-zero b { color: var(--ds-color-text-subtlest); }
</style>
</head>
<body style="margin:0">
<div class="lx l-card">
  <div class="l-trays">
    <div class="k-tray">
      <a class="k-tray-head">12 open tasks<svg class="i s-14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></a>
      <div class="k-statrow l-bad"><span>Blocked</span><b>1</b></div>
      <div class="k-statrow"><span>Waiting</span><b>3</b></div>
      <div class="k-statrow"><span>In progress</span><b>5</b></div>
      <div class="k-statrow"><span>Open</span><b>3</b></div>
    </div>
    <div class="k-tray">
      <a class="k-tray-head">43 open issues<svg class="i s-14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></a>
      <div class="k-statrow l-bad"><span>Critical</span><b>2</b></div>
      <div class="k-statrow l-bad"><span>High</span><b>11</b></div>
      <div class="k-statrow"><span>Moderate</span><b>23</b></div>
      <div class="k-statrow"><span>Low</span><b>7</b></div>
      <div class="k-statrow"><span>No owner</span><b>43</b></div>
    </div>
    <div class="k-tray">
      <a class="k-tray-head">40 open risks<svg class="i s-14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></a>
      <div class="k-statrow"><span>Open</span><b>40</b></div>
      <div class="k-statrow l-zero"><span>Investigating</span><b>0</b></div>
      <div class="k-statrow l-zero"><span>Responding</span><b>0</b></div>
      <div class="k-statrow"><span>No owner</span><b>40</b></div>
    </div>
  </div>
</div>
</body>
</html>
