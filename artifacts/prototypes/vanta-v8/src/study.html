  <section aria-labelledby="moves">
    <div class="head">
      <span class="eyebrow">02 · Three signature moves</span>
      <h2 id="moves">What makes the app read differently at a glance</h2>
    </div>
    <div class="moves">
      <div class="move"><span class="n">01</span><h3>Ink and white; blue only where it means something</h3><p>Primaries, tab underlines, the current nav item and record names go to ink. Ledger blue stays in the brand tile, focus, prose links, applied filters and selection.</p></div>
      <div class="move"><span class="n">02</span><h3>A pair of cards over every register</h3><p>Completion (a 36px figure, an 8px green bar, N of M) beside Needs attention (each line a filter), then the framed table. Every register opens the same way.</p></div>
      <div class="move"><span class="n">03</span><h3>Framed tables, pills with glyphs</h3><p>A grey header band in an 8px-radius frame, 48px rows at 14px, and every status a round pill with its glyph. The dashed ring becomes Ledger's one mark for "nothing yet".</p></div>
    </div>
  </section>

    </div>

  <section aria-labelledby="catalogue">
    <div class="head">
      <span class="eyebrow">04 · Everything Vanta has</span>
      <h2 id="catalogue">Sixteen product areas, and what each becomes in an RMF tool</h2>
    </div>
    <div class="cat">
      <div class="area"><div class="top2"><h3>Home and My work</h3><span class="verdict v-adopt">Adopt</span></div><p class="v">Framework cards (%, bar, N of M); My work by Urgent 31, Coming soon 362, Unscheduled, Waiting on others; one sentence stands for many records.</p><p class="pa"><b>For us:</b> a card per program; My work by urgency — "Add evidence to 234 controls", "Review 1 offer on Mission Computer", "Publish SSP 3".</p></div>
      <div class="area"><div class="top2"><h3>Frameworks and controls</h3><span class="verdict v-adopt">Adopt</span></div><p class="v">Evidence % and Control % per framework, a requirement rail, the control side panel, common controls, "Change this framework's control set? 56 → 130".</p><p class="pa"><b>For us:</b> the redraw above; Edit overlays shows the count before and after, and refuses while a campaign is open.</p></div>
      <div class="area"><div class="top2"><h3>Tests</h3><span class="verdict v-adapt">Adapt</span></div><p class="v">OK 289 of 3,283; Needs attention by Overdue, Due soon, No SLA; a test page with Results, Evidence, History, Controls, How to remediate.</p><p class="pa"><b>For us:</b> checks derived from a program's own parameters — RA-5 scan cadence, SI-2 windows, STIG CAT I/II/III open — each naming its inputs and failing items.</p></div>
      <div class="area"><div class="top2"><h3>Documents</h3><span class="verdict v-adopt">Adopt</span></div><p class="v">What the audit needs, owned and renewed: Get started → Draft → Submit for approval; "Expires on…", prior versions, files pulled from tickets.</p><p class="pa"><b>For us:</b> evidence as what is owed, one row per required artifact, with Renew by and the Review queue as the approval step.</p></div>
      <div class="area"><div class="top2"><h3>Integrations</h3><span class="verdict v-adapt">Adapt</span></div><p class="v">Connected 32 · Errors 8; a directory; Configure scope; "Automates 2 tests and 25 controls"; sync every 1–24 h.</p><p class="pa"><b>For us:</b> an Evidence sources register — an upload wizard for .nessus, STIG checklists and SBOMs, scope per boundary, "Moves 31 objectives", Unlinked assets.</p></div>
      <div class="area"><div class="top2"><h3>Audits</h3><span class="verdict v-adopt">Adopt</span></div><p class="v">A 3-step create, an audit band, the request list, evidence by Not ready · Flagged · Ready · Accepted, an auditor portal.</p><p class="pa"><b>For us:</b> an assessment campaign is a mode; the team moves Not ready → Internal review → Ready, only the assessor sets Flagged or Accepted.</p></div>
      <div class="area"><div class="top2"><h3>Trust Center</h3><span class="verdict v-adapt">Adapt</span></div><p class="v">A public or gated page: draft → review → publish, NDA, watermarks, access requests, a live OSCAL file for FedRAMP.</p><p class="pa"><b>For us:</b> a private package room for the AO or a customer — the SSP, SAR and POA&amp;M as OSCAL, with expiry and an access log.</p></div>
      <div class="area"><div class="top2"><h3>Questionnaires and knowledge base</h3><span class="verdict v-later">Later</span></div><p class="v">AI answers from a knowledge base, review by section, coverage and conflicts, customer commitments as Gap · Unclear · Covered.</p><p class="pa"><b>For us:</b> close to the Compliance matrix of a customer's requirements; the coverage read is the part to take.</p></div>
      <div class="area"><div class="top2"><h3>Policies</h3><span class="verdict v-adapt">Adapt</span></div><p class="v">Template or import, an approver, acceptance N/M by group, renew yearly, versions.</p><p class="pa"><b>For us:</b> the -1 controls' policies as owned evidence with an approver and a renewal date; acceptance by people can wait.</p></div>
      <div class="area"><div class="top2"><h3>Risk</h3><span class="verdict v-adopt">Adopt</span></div><p class="v">A register, scenarios, a library, a rubric, up to 5 approval steps, recurring reviews with a before → after card, locked snapshots "Shared with auditor".</p><p class="pa"><b>For us:</b> risk acceptance with the AO as the last step, and a dated snapshot of what the AO saw at decision.</p></div>
      <div class="area"><div class="top2"><h3>Vendors (TPRM)</h3><span class="verdict v-adapt">Adapt</span></div><p class="v">Inherent risk tier sets review frequency and evidence asked; a vendor portal; a frozen recommendation and decision.</p><p class="pa"><b>For us:</b> suppliers and shared-component owners under SR controls, with tier-driven review dates.</p></div>
      <div class="area"><div class="top2"><h3>Vulnerabilities and inventory</h3><span class="verdict v-adopt">Adopt</span></div><p class="v">By asset or by vulnerability, SLAs by severity, deactivate with a reason, bulk tagging, "in scope" per framework.</p><p class="pa"><b>For us:</b> Findings &amp; assets with Remediate by from severity windows, and a scope card per boundary: "Systems 17 (94%) of 18".</p></div>
      <div class="area"><div class="top2"><h3>People, access, training</h3><span class="verdict v-later">Later</span></div><p class="v">Onboarding task sets, access reviews Draft → In review → Completed, training completion, device monitoring.</p><p class="pa"><b>For us:</b> outside RMF's core today; roles and their holders (wave 8) are the part we already have.</p></div>
      <div class="area"><div class="top2"><h3>AI agent</h3><span class="verdict v-adapt">Adapt</span></div><p class="v">Guided flows, custom agents on a schedule, batches of 20 changes under "Approval required" with Approve / Reject.</p><p class="pa"><b>For us:</b> drafting SSP narratives and mappings in reviewed batches; never applied without a person's approval.</p></div>
      <div class="area"><div class="top2"><h3>Workflow</h3><span class="verdict v-adopt">Adopt</span></div><p class="v">Named SLA categories, bulk owners, "not applicable" with a reason and an end date, alerts batched every 1–4 h, every export as All or Filtered.</p><p class="pa"><b>For us:</b> due dates from named deadlines on POA&amp;M, findings and issues; a Deactivated tab per register.</p></div>
      <div class="area"><div class="top2"><h3>Event log and settings</h3><span class="verdict v-adopt">Adopt</span></div><p class="v">An event log register (type, actor, targets, details, export), roles and teams, workspaces, interface settings.</p><p class="pa"><b>For us:</b> an audit log over our activity events — who changed what, for the assessor.</p></div>
    </div>
  </section>

  <section aria-labelledby="ideas">
    <div class="head">
      <span class="eyebrow">05 · The strongest ideas</span>
      <h2 id="ideas">Ten things to take, in order of what they change</h2>
    </div>
    <div class="ideas">
      <div class="idea"><span class="n">01</span><b>One register shape, everywhere</b><p>Completion card, Needs attention card, rail or quick views, filters, framed table.</p></div>
      <div class="idea"><span class="n">02</span><b>Records open beside the list</b><p>A 440px panel with sections as cards and the next step on top; full pages only for deep work.</p></div>
      <div class="idea"><span class="n">03</span><b>My work by urgency, in sentences</b><p>Overdue, Due soon, Unscheduled, Waiting on others; each sentence opens the filtered register.</p></div>
      <div class="idea"><span class="n">04</span><b>The program switcher in the top bar</b><p>One flat nav under it, grouped Compliance, Risk, System.</p></div>
      <div class="idea"><span class="n">05</span><b>Two-sided evidence status</b><p>The team readies, the assessor flags or accepts — inside a campaign's mode band.</p></div>
      <div class="idea"><span class="n">06</span><b>Due dates from named deadlines</b><p>"Remediate by" from severity windows; red relative words once late.</p></div>
      <div class="idea"><span class="n">07</span><b>Evidence sources with Connected and Errors</b><p>Upload wizards for scans, STIGs and SBOMs; "could not read" never reads as "failed".</p></div>
      <div class="idea"><span class="n">08</span><b>Accountable "not applicable"</b><p>A reason, optional evidence and an end date that switches it back on.</p></div>
      <div class="idea"><span class="n">09</span><b>A change shows its count first</b><p>"56 → 130 controls" before a baseline changes; refused during an open campaign.</p></div>
      <div class="idea"><span class="n">10</span><b>A package room for the AO</b><p>Draft → review → publish, OSCAL files, expiry, an access log, locked risk snapshots.</p></div>
    </div>
  </section>

  <section aria-labelledby="decide">
    <div class="decide">
      <span class="eyebrow">07 · Decisions before anything is built</span>
      <h2 id="decide">What this needs from you</h2>
